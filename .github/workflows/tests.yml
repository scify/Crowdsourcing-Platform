name: "Run Laravel Tests"

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
    contents: read

jobs:
  laravel-tests:
    runs-on: ubuntu-latest
    outputs:
      coverage-pct: ${{ steps.coverage.outputs.pct }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2 # NOSONAR - This action is widely used and trusted
        with:
          php-version: '8.3'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv
          coverage: pcov

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: '.nvmrc'

      - name: Upgrade npm
        run: npm install -g npm@11.16.0 --ignore-scripts

      - name: Run composer install
        run: composer install -n --prefer-dist --no-ansi --no-progress --no-suggest --no-interaction --no-scripts

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Build assets with Vite
        run: npm run build

      - name: Copy .env
        run: cp .env.testing .env

      - name: Generate key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 755 storage bootstrap/cache

      - name: Create storage directories
        run: |
          mkdir -p storage/app
          mkdir -p storage/app/public/uploads/user_profile_img

      - name: Storage Link
        run: php artisan storage:link --env=testing

      - name: Cache
        run: php artisan config:cache --env=testing

      - name: Create a SQLite database for testing
        run: touch storage/database_testing.sqlite

      - name: Run the migrations & seeders in the testing environment
        run: php artisan migrate:fresh --seed --env=testing --database=sqlite_testing

      - name: Execute tests (Unit and Feature tests) via PHPUnit
        run: php artisan test --env=testing --coverage --min=48 --coverage-clover=coverage.xml

      - name: Extract coverage percentage
        id: coverage
        run: |
          pct=$(php -r '$x=simplexml_load_file("coverage.xml"); $m=$x->project->metrics; echo round(100*(int)$m["coveredstatements"]/max(1,(int)$m["statements"]),1);')
          echo "pct=$pct" >> "$GITHUB_OUTPUT"
          echo "Total coverage: $pct%" >> "$GITHUB_STEP_SUMMARY"
  publish-coverage-badge:
    # Publishes the live coverage number that the README badge renders.
    needs: laravel-tests
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Push badge data to the badges branch
        env:
          PCT: ${{ needs.laravel-tests.outputs.coverage-pct }}
          GH_TOKEN: ${{ github.token }}
        run: |
          color=orange
          awk "BEGIN{exit !($PCT >= 50)}" && color=yellow
          awk "BEGIN{exit !($PCT >= 70)}" && color=yellowgreen
          awk "BEGIN{exit !($PCT >= 85)}" && color=brightgreen
          mkdir badges && cd badges
          printf '{"schemaVersion":1,"label":"coverage","message":"%s%%","color":"%s"}\n' "$PCT" "$color" > coverage.json
          git init -b badges -q
          git -c user.name=github-actions -c user.email=github-actions@github.com add coverage.json
          git -c user.name=github-actions -c user.email=github-actions@github.com commit -q -m "coverage: $PCT%"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
